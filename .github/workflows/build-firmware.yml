name: Build Firmware

# Compiles both hardware targets with arduino-cli:
#   - shabbat_countdown_cyd (CYD, plain ESP32) — binaries land in
#     web-flasher/firmware/ so the GitHub Pages-hosted browser flasher
#     always serves whatever's on main.
#   - shabbat_countdown_epaper (CrowPanel ESP32-S3 4.2" e-paper) — binaries
#     land in BOTH epaper-firmware/ (for manual esptool flashing) and
#     web-flasher/firmware-epaper/ (so the same browser flasher page can
#     offer it too, via web-flasher/epaper-manifest.json).
# No desktop Arduino IDE or manual "Export Compiled Binary" step required —
# push a sketch change and this does it.

on:
  push:
    branches: [ main ]
    paths:
      - 'shabbat_countdown_cyd/shabbat_countdown_cyd.ino'
      - 'shabbat_countdown_epaper/shabbat_countdown_epaper.ino'
      - '.github/workflows/build-firmware.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5 # v5+ targets Node 24 natively, clearing that deprecation warning

      - name: Install arduino-cli
        # No newer major of this action exists yet (still v2, last bumped to
        # Node 20) — GitHub's "forced to run on Node 24" warning for this one
        # is just its compatibility shim kicking in, and is harmless; there's
        # nothing to pin to until arduino/setup-arduino-cli ships a Node
        # 24-targeting release.
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          # Pinned, not "latest": the ESP32 Arduino core's 3.x line changed
          # the LEDC (PWM backlight) API this sketch uses — ledcSetup()/
          # ledcAttachPin() were replaced by ledcAttach(). 2.0.17 is the
          # version this project was originally built and confirmed working
          # against; bump deliberately (and update the ledc calls in the
          # .ino to match) rather than silently picking up a newer major.
          arduino-cli core install esp32:esp32@2.0.17

      - name: Install libraries
        run: |
          arduino-cli lib install \
            "Adafruit GFX Library" \
            "Adafruit ILI9341" \
            "XPT2046_Touchscreen" \
            "GxEPD2" \
            "ArduinoJson"

      - name: Compile CYD sketch (ESP32 Dev Module, i.e. the plain ESP32 the CYD uses)
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --export-binaries \
            -v \
            shabbat_countdown_cyd

      - name: Compile e-paper sketch (ESP32S3 Dev Module, PSRAM enabled)
        # PSRAM=opi assumes the "octal" PSRAM variant (matches the
        # ESP32-S3-WROOM-1-N8R8 module this board uses); if the ESP32
        # Arduino core's menu option name has drifted by the time you read
        # this, `arduino-cli board details -b esp32:esp32:esp32s3` lists
        # the current valid values.
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3:PSRAM=opi,FlashSize=8M \
            --export-binaries \
            -v \
            shabbat_countdown_epaper

      - name: Collect firmware binaries for the web flasher
        run: |
          mkdir -p web-flasher/firmware
          BUILD_DIR=shabbat_countdown_cyd/build/esp32.esp32.esp32
          cp "$BUILD_DIR/shabbat_countdown_cyd.ino.bin"          web-flasher/firmware/firmware.bin
          cp "$BUILD_DIR/shabbat_countdown_cyd.ino.bootloader.bin" web-flasher/firmware/bootloader.bin
          cp "$BUILD_DIR/shabbat_countdown_cyd.ino.partitions.bin" web-flasher/firmware/partitions.bin
          # boot_app0.bin isn't exported by arduino-cli — it's a static file
          # bundled with the ESP32 core itself; find and copy it directly.
          BOOT_APP0=$(find ~/.arduino15/packages/esp32 -name boot_app0.bin | head -n1)
          cp "$BOOT_APP0" web-flasher/firmware/boot_app0.bin

      - name: Collect e-paper firmware binaries
        run: |
          mkdir -p epaper-firmware web-flasher/firmware-epaper
          BUILD_DIR=shabbat_countdown_epaper/build/esp32.esp32.esp32s3
          BOOT_APP0=$(find ~/.arduino15/packages/esp32 -name boot_app0.bin | head -n1)
          for DEST in epaper-firmware web-flasher/firmware-epaper; do
            cp "$BUILD_DIR/shabbat_countdown_epaper.ino.bin"          "$DEST/firmware.bin"
            cp "$BUILD_DIR/shabbat_countdown_epaper.ino.bootloader.bin" "$DEST/bootloader.bin"
            cp "$BUILD_DIR/shabbat_countdown_epaper.ino.partitions.bin" "$DEST/partitions.bin"
            cp "$BOOT_APP0" "$DEST/boot_app0.bin"
          done

      - name: Commit updated firmware binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web-flasher/firmware web-flasher/firmware-epaper epaper-firmware
          git diff --cached --quiet || git commit -m "Auto-build: update firmware binaries [skip ci]"
          git push
